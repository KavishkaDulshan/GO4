name: Deploy Backend to Azure VM

on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - "docker-compose.prod.yml"
            - ".github/workflows/deploy.yml"

jobs:
    deploy:
        name: Build & deploy on Azure VM
        runs-on: ubuntu-latest

        steps:
            - name: SSH into VM and redeploy
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USERNAME }}
                  key: ${{ secrets.VM_SSH_KEY }}
                  port: 22
                  script: |
                      set -e

                      echo "──────────────────────────────────────────"
                      echo " Go4 Auto-Deploy"
                      echo "──────────────────────────────────────────"

                      # ── 1. Pull latest code ──────────────────────
                      cd ~/go4-project/GO4
                      git fetch origin main
                      git reset --hard origin/main
                      echo "✅ Code updated"

                      # ── 2. Rebuild and restart on port 80 ────────
                      sudo docker compose -f docker-compose.prod.yml down
                      sudo docker compose -f docker-compose.prod.yml up -d --build
                      echo "✅ Container restarted"

                      # ── 3. Remove dangling images (saves disk) ───
                      sudo docker image prune -f

                      # ── 4. Health check ──────────────────────────
                      echo "Waiting for server to start..."
                      sleep 10
                      curl -sf http://localhost/api/v1/health \
                        && echo "✅ Backend is healthy" \
                        || (echo "❌ Health check failed — last 30 log lines:" \
                            && sudo docker logs --tail 30 go4-backend \
                            && exit 1)
